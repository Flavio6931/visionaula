[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
markers =
    unit: pruebas unitarias (funciones aisladas, sin base de datos)
    integration: pruebas de integración con Django, rutas y base de datos
    models: requieren los modelos ONNX descargados
    functional: pruebas funcionales de casos de uso con las redes reales de OpenCV
    e2e: pruebas de extremo a extremo en un navegador real (Playwright + cámara simulada)
